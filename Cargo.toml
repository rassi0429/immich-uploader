[package]
name = "immich-auto-uploader"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
directories = "6.0.0"
eframe = "0.33.3"
image = "0.25.10"
kill_tree = { version = "0.2.4", features = ["tokio"] }
rfd = "0.17.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
tokio = { version = "1.52.1", features = ["process", "io-util", "rt-multi-thread", "sync", "macros", "time"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
tray-icon = "0.22.1"
uuid = { version = "1.23.1", features = ["v4"] }
vte = "0.15.0"
which = "8.0.2"
windows = { version = "0.62.2", features = ["Win32_System_Threading", "Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Diagnostics_ToolHelp", "Win32_Security"] }
winreg = "0.56.0"
